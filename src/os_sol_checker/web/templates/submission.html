<section class="panel" aria-labelledby="result-title">
  <h2 id="result-title">Последняя посылка</h2>
  <p id="result-status" role="status" aria-live="polite">Загрузка истории…</p>
  <div id="result-content" hidden>
    <label for="submission-id">UUID посылки<input id="submission-id" readonly aria-describedby="copy-help"></label>
    <p id="copy-help">UUID можно выделить и скопировать.</p>
    <p id="result-cache"></p>
    <p id="result-counts"></p>
    <p id="result-context"></p>
    <p id="result-stale" class="notice" hidden>Результат устарел. Выберите файл и отправьте решение заново; автоматического запуска не будет.</p>
    <section id="first-failure" hidden aria-labelledby="failure-title">
      <h3 id="failure-title">Первое нарушение</h3><p id="failure-message"></p>
      <div id="failure-previews"></div>
    </section>
  </div>
</section>
