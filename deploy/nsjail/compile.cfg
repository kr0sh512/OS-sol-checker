name: "checker-compile-v1"
mode: ONCE
hostname: "checker"
cwd: "/work"
clone_newnet: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
clone_newcgroup: true
iface_no_lo: true
keep_env: false
envar: "PATH=/usr/bin:/bin"
envar: "LANG=C"
envar: "LC_ALL=C"
envar: "HOME=/work"
envar: "TMPDIR=/work/tmp"
keep_caps: false
disable_no_new_privs: false
uidmap { inside_id: "65534" outside_id: "65534" count: 1 }
gidmap { inside_id: "65534" outside_id: "65534" count: 1 }
mount_proc: true
rlimit_core: 0
rlimit_nofile: 64
rlimit_nproc_type: HARD
rlimit_stack: 8
rlimit_stack_type: VALUE
rlimit_cpu: 60
rlimit_as_type: HARD
rlimit_fsize_type: HARD
use_cgroupv2: false
seccomp_policy_file: "/opt/checker/deploy/nsjail/compile.policy"
log_level: FATAL
