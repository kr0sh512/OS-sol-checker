name: os-sol-checker

x-application: &application
  image: ${APPLICATION_IMAGE:?Set an immutable application image reference}
  build:
    context: .
    dockerfile: deploy/containers/application.Dockerfile
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:size=64m,mode=1777,nosuid,nodev,noexec"]
  pids_limit: 64
  mem_limit: 384m
  memswap_limit: 384m
  cpus: 1.0
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

services:
  postgres-transient:
    image: postgres:17.5-bookworm
    environment:
      POSTGRES_USER: checker_owner
      POSTGRES_DB: checker_transient
      POSTGRES_PASSWORD_FILE: /run/secrets/transient_owner_password
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: [postgres, -c, max_connections=80, -c, shared_buffers=64MB, -c, temp_file_limit=65536]
    networks: [db-transient]
    secrets: [transient_owner_password, web_password, worker_password, catalog_password]
    volumes: [./deploy/postgres/transient-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro]
    tmpfs: ["/var/lib/postgresql/data:size=1024m,uid=999,gid=999,mode=0700,nosuid,nodev,noexec", "/var/run/postgresql:size=8m,uid=999,gid=999"]
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U checker_owner -d checker_transient]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1536m
    memswap_limit: 1536m
    pids_limit: 128
    cpus: 1.0
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: *logging

  postgres-archive:
    image: postgres:17.5-bookworm
    environment:
      POSTGRES_USER: checker_owner
      POSTGRES_DB: checker_archive
      POSTGRES_PASSWORD_FILE: /run/secrets/archive_owner_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: [postgres, -c, max_connections=32, -c, shared_buffers=64MB, -c, temp_file_limit=65536]
    networks: [db-archive]
    secrets: [archive_owner_password, archive_worker_password]
    volumes:
      - archive-data:/var/lib/postgresql/data
      - ./deploy/postgres/archive-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    tmpfs: ["/var/run/postgresql:size=8m,uid=999,gid=999"]
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U checker_owner -d checker_archive]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 64
    cpus: 1.0
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: *logging

  migrate:
    <<: *application
    restart: "no"
    command: [checker-migrate, --web-role, checker_web, --worker-role, checker_worker, --catalog-role, checker_catalog, --archive-role, checker_archive_runtime]
    environment:
      CHECKER_SERVICE: migrate
      TRANSIENT_MIGRATION_DATABASE_URL_FILE: /run/secrets/transient_migration_database_url
      ARCHIVE_MIGRATION_DATABASE_URL_FILE: /run/secrets/archive_migration_database_url
    secrets: [transient_migration_database_url, archive_migration_database_url]
    networks: [db-transient, db-archive]
    depends_on:
      postgres-transient: {condition: service_healthy}
      postgres-archive: {condition: service_healthy}

  web:
    <<: *application
    command: [checker-web]
    environment:
      CHECKER_SERVICE: web
      TRANSIENT_DATABASE_URL_FILE: /run/secrets/web_database_url
      CSRF_SECRET_FILE: /run/secrets/csrf_secret
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set the exact public HTTPS origin}
      CATALOG_ROOT: /var/lib/checker/catalog
    secrets: [web_database_url, csrf_secret]
    networks: [frontend, db-transient]
    ports: [127.0.0.1:8000:8000]
    volumes: [catalog:/var/lib/checker/catalog:ro]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *application
    command: [checker-worker]
    environment:
      CHECKER_SERVICE: worker
      TRANSIENT_DATABASE_URL_FILE: /run/secrets/worker_database_url
      ARCHIVE_DATABASE_URL_FILE: /run/secrets/archive_database_url
      RUNNER_TOKEN_FILE: /run/secrets/runner_token
      RUNNER_URL: http://runner:8081
      CATALOG_ROOT: /var/lib/checker/catalog
      MAX_CONCURRENT_SANDBOXES: "4"
    secrets: [worker_database_url, archive_database_url, runner_token]
    networks: [db-transient, db-archive, worker-runner]
    volumes: [catalog:/var/lib/checker/catalog:ro]
    depends_on:
      migrate: {condition: service_completed_successfully}
      runner: {condition: service_healthy}

  catalog-sync:
    <<: *application
    mem_limit: 1024m
    memswap_limit: 1024m
    command: [checker-catalog]
    environment:
      CHECKER_SERVICE: catalog
      TRANSIENT_DATABASE_URL_FILE: /run/secrets/catalog_database_url
      CATALOG_ROOT: /var/lib/checker/catalog
      TASKS_REPOSITORY_URL: https://github.com/kr0sh512/OS-tasks
      TASKS_REPOSITORY_REF: main
    secrets: [catalog_database_url]
    networks: [db-transient, catalog-egress]
    volumes: [catalog:/var/lib/checker/catalog]
    depends_on:
      migrate: {condition: service_completed_successfully}

  runner:
    image: ${RUNNER_IMAGE:?Set a published immutable runner image reference}
    build:
      context: .
      dockerfile: deploy/containers/runner.Dockerfile
    command: [checker-runner]
    user: "0:0"
    read_only: true
    environment:
      CHECKER_SERVICE: runner
      RUNNER_TOKEN_FILE: /run/secrets/runner_token
      RUNNER_IMAGE: ${RUNNER_IMAGE:?Set a published immutable runner image reference}
      MAX_CONCURRENT_SANDBOXES: "4"
      NSJAIL_CGROUP_ROOT: /run/checker-cgroup
    secrets: [runner_token]
    networks: [worker-runner]
    cap_drop: [ALL]
    cap_add: [SYS_ADMIN, SYS_CHROOT, SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETPCAP]
    security_opt:
      - no-new-privileges:true
      - seccomp=./deploy/security/runner-seccomp.json
      - apparmor=checker-runner
    # Only the outer cgroup namespace is shared to permit controlled migration
    # into the separately budgeted delegated hierarchy. PID/network remain private.
    cgroup: host
    volumes:
      - type: bind
        source: ${CHECKER_CGROUP_HOST:?Provision the bounded delegated stage subtree first}
        target: /run/checker-cgroup
        bind: {propagation: rprivate, create_host_path: false}
    tmpfs:
      - /work/runner:size=160m,mode=0711,nosuid,nodev
      - /run/user:size=16m,mode=0755,nosuid,nodev
      - /tmp:size=8m,mode=1777,nosuid,nodev,noexec
      - /sys/fs/cgroup:size=4k,mode=0555,ro,nosuid,nodev,noexec
    # Stage processes are charged to the independently bounded delegated cgroup,
    # NOT this container cgroup after migration. These limits bound trusted control.
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    cpus: 1.0
    stop_grace_period: 10s
    healthcheck:
      test: [CMD, /opt/checker/.venv/bin/python, /opt/checker/deploy/container_entrypoint.py, checker-runner, --health]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 30s
    restart: unless-stopped
    logging: *logging

networks:
  frontend: {}
  db-transient: {internal: true}
  db-archive: {internal: true}
  worker-runner: {internal: true}
  catalog-egress: {}
volumes:
  catalog: {}
  archive-data: {}
secrets:
  transient_owner_password: {file: ./deploy/secrets/transient_owner_password}
  archive_owner_password: {file: ./deploy/secrets/archive_owner_password}
  web_password: {file: ./deploy/secrets/web_password}
  worker_password: {file: ./deploy/secrets/worker_password}
  catalog_password: {file: ./deploy/secrets/catalog_password}
  archive_worker_password: {file: ./deploy/secrets/archive_worker_password}
  web_database_url: {file: ./deploy/secrets/web_database_url}
  worker_database_url: {file: ./deploy/secrets/worker_database_url}
  catalog_database_url: {file: ./deploy/secrets/catalog_database_url}
  archive_database_url: {file: ./deploy/secrets/archive_database_url}
  transient_migration_database_url: {file: ./deploy/secrets/transient_migration_database_url}
  archive_migration_database_url: {file: ./deploy/secrets/archive_migration_database_url}
  csrf_secret: {file: ./deploy/secrets/csrf_secret}
  runner_token: {file: ./deploy/secrets/runner_token}
